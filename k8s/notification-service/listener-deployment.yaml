apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-listener
  namespace: q-live
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-listener
  template:
    metadata:
      labels:
        app: notification-listener
    spec:
      containers:
        - name: notification-listener
          image: abhinavashok/qa-live-notification-service:latest
          imagePullPolicy: Always
          command: ["python", "manage.py", "listen_rabbitmq"]
          env:
            - name: DB_HOST
              value: notification-db
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: REDIS_HOST
              value: redis