apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-db
  namespace: q-live
spec:
  replicas: 1
  selector:
    matchLabels: 
      app: notification-db
  template:
    metadata:
      labels: 
        app: notification-db
    spec: 
      containers:
        - name: notification-db
          image: postgres:15-alpine
          ports: 
            - containerPort: 5432
          env: 
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: 
                  name: db-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              value: notification-db 
          volumeMounts: 
            - name: notification-db-storage
              mountPath: /var/lib/postgresql/data
      volumes: 
        - name: notification-db-storage
          persistentVolumeClaim:
            claimName: notification-db-pvc


---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notification-db-pvc
  namespace: q-live
spec:
  accessModes: ["ReadWriteOnce"]
  resources: 
    requests: 
      storage: 1Gi

---

apiVersion: v1
kind: Service
metadata: 
  name: notification-db
  namespace: q-live
spec:
  selector:
    app: notification-db
  ports:
    - port: 5432
      targetPort: 5432