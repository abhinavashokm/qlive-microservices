name: Deploy

# Runs after the CI workflow finishes successfully on main or develop
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, develop]

jobs:

  docker-build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    # Only proceed if the CI run this was triggered by actually passed
    if: github.event.workflow_run.conclusion == 'success'

    strategy:
      matrix:
        service: [auth-service, question-service, notification-service, frontend]

    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the exact commit that CI just tested — not just
          # whatever HEAD happens to be when this workflow_run fires
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/qa-live-${{ matrix.service }}:latest
            ${{ secrets.DOCKER_USERNAME }}/qa-live-${{ matrix.service }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max