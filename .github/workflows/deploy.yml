name: Deploy

# Runs after the CI workflow finishes successfully on main or develop
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, develop]

jobs:

  docker-build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    # Only proceed if the CI run this was triggered by actually passed
    if: github.event.workflow_run.conclusion == 'success'

    strategy:
      matrix:
        service: [auth-service, question-service, notification-service, frontend]

    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the exact commit that CI just tested — not just
          # whatever HEAD happens to be when this workflow_run fires
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/qa-live-${{ matrix.service }}:latest
            ${{ secrets.DOCKER_USERNAME }}/qa-live-${{ matrix.service }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy-to-minikube:
    name: Deploy to Minikube
    runs-on: self-hosted

    needs: docker-build-push

    steps:
      - name: Update Kubernetes images
        run: |
          kubectl set image deployment/auth-service \
            auth-service=${{ secrets.DOCKER_USERNAME }}/qa-live-auth-service:${{ github.event.workflow_run.head_sha }} \
            -n q-live

          kubectl set image deployment/question-service \
            question-service=${{ secrets.DOCKER_USERNAME }}/qa-live-question-service:${{ github.event.workflow_run.head_sha }} \
            -n q-live

          kubectl set image deployment/notification-service \
            notification-service=${{ secrets.DOCKER_USERNAME }}/qa-live-notification-service:${{ github.event.workflow_run.head_sha }} \
            -n q-live

          kubectl set image deployment/frontend \
            frontend=${{ secrets.DOCKER_USERNAME }}/qa-live-frontend:${{ github.event.workflow_run.head_sha }} \
            -n q-live

      - name: Wait for deployments
        id: rollout
        continue-on-error: true
        run: |
          kubectl rollout status deployment/auth-service -n q-live --timeout=120s
          kubectl rollout status deployment/question-service -n q-live --timeout=120s
          kubectl rollout status deployment/notification-service -n q-live --timeout=120s
          kubectl rollout status deployment/frontend -n q-live --timeout=120s

      - name: Rollback failed deployments
        if: steps.rollout.outcome == 'failure'
        run: |
          echo "Deployment failed. Starting rollback..."

          kubectl rollout undo deployment/auth-service -n q-live
          kubectl rollout undo deployment/question-service -n q-live
          kubectl rollout undo deployment/notification-service -n q-live
          kubectl rollout undo deployment/frontend -n q-live

          echo "Rollback commands completed."

      - name: Verify rollback
        if: steps.rollout.outcome == 'failure'
        run: |
          kubectl rollout status deployment/auth-service -n q-live --timeout=120s
          kubectl rollout status deployment/question-service -n q-live --timeout=120s
          kubectl rollout status deployment/notification-service -n q-live --timeout=120s
          kubectl rollout status deployment/frontend -n q-live --timeout=120s

      - name: Verify deployment
        if: steps.rollout.outcome == 'success'
        run: |
          kubectl get deployments -n q-live
          kubectl get pods -n q-live