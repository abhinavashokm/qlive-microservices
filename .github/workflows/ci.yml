name: CI

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]

jobs:

  # ==========================================
  # TEST AUTH SERVICE
  # ==========================================
  test-auth-service:
    name: Test auth-service
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: auth-db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: auth-service

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: auth-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install coverage
        run: pip install coverage

      - name: Django system check
        run: python manage.py check

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests with coverage
        run: |
          coverage run manage.py test
          coverage xml -o coverage.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: auth-coverage
          path: auth-service/coverage.xml


  # ==========================================
  # TEST QUESTION SERVICE
  # ==========================================
  test-question-service:
    name: Test question-service
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: question-db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: question-service

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5433
      DB_NAME: question-db
      DB_PASSWORD: postgrespassword
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      RABBITMQ_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: question-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install coverage
        run: pip install coverage

      - name: Django system check
        run: python manage.py check

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests with coverage
        run: |
          coverage run manage.py test
          coverage xml -o coverage.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: question-coverage
          path: question-service/coverage.xml


  # ==========================================
  # TEST NOTIFICATION SERVICE
  # ==========================================
  test-notification-service:
    name: Test notification-service
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: notification-db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: notification-service

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5434
      DB_NAME: notification-db
      DB_PASSWORD: postgrespassword
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6380

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: notification-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install coverage
        run: pip install coverage

      - name: Django system check
        run: python manage.py check

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests with coverage
        run: |
          coverage run manage.py test
          coverage xml -o coverage.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: notification-coverage
          path: notification-service/coverage.xml


  # ==========================================
  # TEST FRONTEND
  # ==========================================
  test-frontend:
    name: Test frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          VITE_PORT: 3000
          VITE_SHORTENER_URL: http://localhost:8001
          VITE_STATS_URL: http://localhost:8002
          VITE_NOTIFICATION_URL: http://localhost:8003

      - name: Build
        run: npm run build
        env:
          VITE_PORT: 3000
          VITE_SHORTENER_URL: http://localhost:8001
          VITE_STATS_URL: http://localhost:8002
          VITE_NOTIFICATION_URL: http://localhost:8003

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info


  # ==========================================
  # SONARCLOUD CODE QUALITY
  # ==========================================
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    needs:
      - test-auth-service
      - test-question-service
      - test-notification-service
      - test-frontend

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Download Python coverage reports
      - name: Download auth coverage
        uses: actions/download-artifact@v4
        with:
          name: auth-coverage
          path: auth-service

      - name: Download question coverage
        uses: actions/download-artifact@v4
        with:
          name: question-coverage
          path: question-service

      - name: Download notification coverage
        uses: actions/download-artifact@v4
        with:
          name: notification-coverage
          path: notification-service

      # Download frontend coverage
      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      # SonarCloud
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io